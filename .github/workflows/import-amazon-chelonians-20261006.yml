name: Import Amazon chelonians 2026-10-06

on:
  push:
    paths:
      - "batches/amazon-chelonians-20261006.json"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize case records
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          rows=json.load(open("batches/amazon-chelonians-20261006.json",encoding="utf-8"))
          sci="Pantoja-Lima et al. (2014), Journal of Ethnobiology and Ethnomedicine 10:8, DOI 10.1186/1746-4269-10-8"
          news="Folha de S.Paulo (2026) — https://www1.folha.uol.com.br/ambiente/2026/03/projeto-de-soltura-de-tartarugas-na-amazonia-bate-recorde-mas-trafico-ameaca-conservacao.shtml"
          def slug(s):
              import unicodedata
              s=unicodedata.normalize("NFD",s).encode("ascii","ignore").decode().lower()
              return re.sub(r"[^a-z0-9]+","-",s).strip("-")[:52]
          def men(m): return {"Fluvial":"River/boat","Aéreo":"Air","Rodoviário":"Road","Terrestre":"Land"}.get(m,m)
          def mes(m): return {"Rodoviário":"Carretero"}.get(m,m)
          for i,r in enumerate(rows,1):
              date=r["date"]; loc=r["loc"]; pt=r["pt"]; en=r["en"]; es=r["es"]; modal=r["modal"]; source=r["source"]; url=r["url"]
              rid=f"{date}__amazon-chelonians-{i:02d}-{slug(loc)}__round-20261006"
              rec={
                "legacy_index":None,"legacy_site_id":None,"reconstruction_batch":"amazon_chelonian_round_2026-10-06_no_dedup",
                "reconstruction_confidence":"CONFIRMED_SOURCE_EVENT","added_at":"2026-10-06T22:55:00-04:00","status":"VALIDATED",
                "aggregate_operation":False,"exclude_from_totals":False,"migration_status":"READY_FOR_CUTOVER",
                "source_reconciliation_status":"SOURCE_URL_RECONCILED","translation_status":"EN_ES_COMPLETE","case_context_status":"PT_EN_ES_COMPLETE",
                "fauna_groups_aggregated":["Répteis"],"quantity_by_group":{},"quantity_unassigned":0,
                "image_url":None,"image_status":"SOURCE_PAGE_HAS_IMAGE_UNRESOLVED_DIRECT_URL","image_checked_at":"2026-10-06T22:55:00-04:00",
                "id":rid,"location_label_pt":loc,"location_label_en":loc,"location_label_es":loc,"country":"Brasil",
                "title_pt":f"Apreensão de {pt} em {loc}","title_en":f"Seizure of {en} in {loc}","title_es":f"Decomiso de {es} en {loc}",
                "source_label":source,"source_url":url,"publication_date":None,"event_date":date,
                "fauna_label_pt":pt,"fauna_label_en":en,"fauna_label_es":es,"taxon_text":r["taxon"],
                "modal_primary":modal,"modal_label_pt":modal,"modal_label_en":men(modal),"modal_label_es":mes(modal),
                "card_text_pt":r["fpt"],"card_text_en":r["fen"],"card_text_es":r["fes"],
                "coordinates":{"lat":r["lat"],"lon":r["lon"]},"coordinate_precision":"city_generalized",
                "geographic_note_pt":"Coordenadas aproximadas da localidade documentada.",
                "geographic_note_en":"Approximate coordinates for the documented locality.",
                "geographic_note_es":"Coordenadas aproximadas de la localidad documentada.",
                "context_pt":f"Fatos documentados [O1]: {r['fpt']} Relação com a ciência [S1]: estudo sobre a cadeia de comercialização de Podocnemis spp. no rio Purus documenta captura, consumo e comércio clandestino e intermediários regionais; é usado apenas como contexto, não como prova deste evento. Relação com reportagens [N1]: reportagem sobre conservação e tráfico de quelônios no baixo rio Negro fornece contexto contemporâneo sobre pressão de captura e mercado regional; não é usada para inferir fatos além da fonte primária. Síntese: o evento reforça o padrão recorrente de exploração ilegal de quelônios amazônicos. Limites da evidência: não são inferidas origem, destino, rede criminosa ou espécie quando a fonte primária não os informa.",
                "context_en":f"Documented facts [O1]: {r['fen']} Relation to science [S1]: a study of the Podocnemis spp. commercialization chain on the Purus River documents clandestine capture, consumption and trade and regional intermediaries; it is used only as context, not as evidence for this event. Relation to reporting [N1]: reporting on conservation and trafficking of Amazon river turtles in the lower Negro River provides contemporary context on capture pressure and regional markets; it is not used to infer facts beyond the primary source. Integrated reading: the event reinforces the recurrent pattern of illegal exploitation of Amazonian chelonians. Evidence limits: origin, destination, criminal network or species are not inferred when the primary source does not report them.",
                "context_es":f"Hechos documentados [O1]: {r['fes']} Relación con la ciencia [S1]: un estudio sobre la cadena de comercialización de Podocnemis spp. en el río Purus documenta captura, consumo y comercio clandestino e intermediarios regionales; se utiliza solo como contexto, no como prueba de este evento. Relación con reportajes [N1]: un reportaje sobre conservación y tráfico de quelonios amazónicos en el bajo río Negro aporta contexto contemporáneo sobre presión de captura y mercados regionales; no se utiliza para inferir hechos más allá de la fuente primaria. Lectura integrada: el evento refuerza el patrón recurrente de explotación ilegal de quelonios amazónicos. Límites de la evidencia: no se infieren origen, destino, red criminal ni especie cuando la fuente primaria no los informa.",
                "references_text_pt":f"[O1] {source} — {url}; [S1] {sci}; [N1] {news}",
                "references_text_en":f"[O1] {source} — {url}; [S1] {sci}; [N1] {news}",
                "references_text_es":f"[O1] {source} — {url}; [S1] {sci}; [N1] {news}",
                "quantity_count":r["count"],"quantity_qualifier":r["qual"],"quantity_kind":"live_animals_and_or_eggs",
                "quantity_note_pt":pt,"quantity_note_en":en,"quantity_note_es":es,"image_source_url":url
              }
              y,m=date.split("-")[:2]
              p=Path("cases")/y/m/f"{rid}.json"; p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(rec,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Validate and compile
        run: |
          python scripts/case_store.py validate --root cases
          python scripts/case_store.py build --root cases --output cases.json
          python -m json.tool cases.json > /dev/null
      - name: Commit imported records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases cases.json
          git commit -m "Import Amazon chelonian seizure round (no dedup)"
          git push
