name: Apply validated TG-H imports
on:
  push:
    paths:
      - 'imports/tgh-*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgh-canonical-main
  cancel-in-progress: false
jobs:
  merge-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Apply canonical, deduplicated TG-H import
        run: python3 scripts/merge_tgh_import.py
      - name: Commit and push canonical feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases.json routes.json
          if git diff --cached --quiet; then
            echo "No new records; nothing to publish."
            exit 0
          fi
          git commit -m "Apply validated TG-H imports to canonical cases and routes"
          git push origin HEAD:main
