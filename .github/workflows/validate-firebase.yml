name: Validate preserved Firebase authorization
on:
  pull_request:
    paths: ['firebase/**', '.github/workflows/validate-firebase.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.11.1
      - run: npx firebase emulators:exec --only firestore --project demo-nimf-access-tests "node tests/firestore-access.test.mjs"
