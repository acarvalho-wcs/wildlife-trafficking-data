name: Deploy independent staging (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observatory-staging
  cancel-in-progress: false
jobs:
  deploy:
    environment: observatory-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/case_store.py validate --root cases
      - run: python scripts/build_site.py && python scripts/check_migration.py
      - name: Publish draft to isolated staging project
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: c3c10b88-1e65-4967-99b2-b8b26976c885
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Configure NETLIFY_AUTH_TOKEN in the staging environment'; exit 1; }
          npx --yes netlify-cli@23.11.0 deploy --dir build/site --site "$NETLIFY_SITE_ID" --json > staging-deploy.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-result
          path: staging-deploy.json
