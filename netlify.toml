[build]
  command = "python3 scripts/build_site.py && python3 scripts/check_migration.py"
  publish = "build/site"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/restricted/*"
  [headers.values]
    Cache-Control = "private, no-store"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/secure.html"
  to = "/restricted/secure.html"
  status = 302
